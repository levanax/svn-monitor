<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVN Monitor</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="titlebar" aria-label="标题栏">
        <div class="titlebar-brand" data-tauri-drag-region>
          <img class="titlebar-icon" src="/app-icon.png" width="16" height="16" alt="" data-tauri-drag-region />
          <span class="titlebar-app" data-tauri-drag-region>SVN Monitor</span>
        </div>

        <nav class="menubar" aria-label="菜单">
          <div class="menubar-item">
            <button type="button" class="menubar-btn" id="menu-ops-btn" aria-haspopup="true" aria-expanded="false">
              操作
            </button>
            <div class="menubar-panel" id="menu-ops" role="menu" hidden>
              <button type="button" class="menubar-cmd" role="menuitem" id="btn-add">添加目录</button>
              <button type="button" class="menubar-cmd" role="menuitem" id="btn-add-group">新建分组</button>
              <button type="button" class="menubar-cmd" role="menuitem" id="btn-refresh">全部刷新</button>
            </div>
          </div>
          <div class="menubar-item">
            <button type="button" class="menubar-btn" id="menu-settings-btn" aria-haspopup="true" aria-expanded="false">
              设置
            </button>
            <div class="menubar-panel menubar-panel-settings" id="menu-settings" role="menu" hidden>
              <label class="field menubar-field">
                <span>间隔(分钟)</span>
                <input type="number" id="interval" min="1" max="120" step="1" />
              </label>
              <label class="check menubar-field">
                <input type="checkbox" id="autostart" />
                <span>开机启动</span>
              </label>
              <label class="field menubar-field hotkey-field">
                <span>唤起快捷键</span>
                <input
                  type="text"
                  id="open-hotkey"
                  readonly
                  placeholder="点击后按键"
                  title="点击后按下组合键；Esc 清除"
                  aria-label="唤起主窗口快捷键"
                />
              </label>
              <label class="field menubar-field">
                <span>主题</span>
                <select id="theme">
                  <option value="system">跟随系统</option>
                  <option value="light">浅色</option>
                  <option value="dark">深色</option>
                  <option value="dawn">晨曦</option>
                  <option value="sky">晴空</option>
                  <option value="lilac">丁香</option>
                  <option value="mint">薄荷</option>
                  <option value="dusk">暮色</option>
                  <option value="noir">静夜</option>
                </select>
              </label>
            </div>
          </div>
        </nav>

        <div class="titlebar-drag" data-tauri-drag-region>
          <p id="status-line" class="status-line" role="status" data-tauri-drag-region></p>
        </div>

        <div class="titlebar-controls" aria-label="窗口控制">
          <button type="button" class="titlebar-btn" id="titlebar-minimize" title="最小化" aria-label="最小化">
            <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path fill="currentColor" d="M1 5h8v1H1z"/></svg>
          </button>
          <button type="button" class="titlebar-btn" id="titlebar-maximize" title="最大化" aria-label="最大化" aria-pressed="false" data-maximized="false">
            <svg class="icon-maximize" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
              <rect x="1.5" y="1.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1" />
            </svg>
            <svg class="icon-restore" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
              <path fill="none" stroke="currentColor" stroke-width="1" d="M2.5 3.5h5v5h-5z" />
              <path fill="none" stroke="currentColor" stroke-width="1" d="M3.5 3.5V2h5v5H7" />
            </svg>
          </button>
          <button type="button" class="titlebar-btn titlebar-btn-close" id="titlebar-close" title="关闭" aria-label="关闭">
            <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path fill="currentColor" d="M1.2 1.2l7.6 7.6-.7.7L.5 1.9zm7.6 0L1.2 8.8l.7.7 7.6-7.6z"/></svg>
          </button>
        </div>
      </header>

      <main>
        <div id="project-list" class="project-list" aria-live="polite"></div>
        <p id="empty" class="empty hidden">还没有监控目录。点击「操作 → 添加目录」或从资源管理器拖入 SVN 工作副本。</p>
      </main>
    </div>

    <dialog id="group-picker" class="group-picker">
      <form method="dialog" id="group-picker-form">
        <h3>选择保存到的分组</h3>
        <p id="group-picker-hint" class="group-picker-hint"></p>
        <div id="group-picker-list" class="group-picker-list" role="group" aria-label="分组列表"></div>
        <div class="group-picker-actions">
          <button type="submit" value="cancel" class="btn ghost">取消</button>
          <button type="submit" value="ok" class="btn primary" id="group-picker-ok">确定</button>
        </div>
      </form>
    </dialog>

    <dialog id="confirm-dialog" class="group-picker confirm-dialog">
      <form method="dialog" id="confirm-form">
        <h3 id="confirm-title">确认</h3>
        <p id="confirm-message" class="group-picker-hint"></p>
        <div class="group-picker-actions">
          <button type="submit" value="cancel" class="btn ghost" id="confirm-cancel">取消</button>
          <button type="submit" value="ok" class="btn danger" id="confirm-ok">确定</button>
        </div>
      </form>
    </dialog>

    <dialog id="prompt-dialog" class="group-picker prompt-dialog">
      <form method="dialog" id="prompt-form">
        <h3 id="prompt-title">输入</h3>
        <p id="prompt-message" class="group-picker-hint" hidden></p>
        <label class="prompt-field">
          <span class="visually-hidden" id="prompt-input-label">名称</span>
          <input type="text" id="prompt-input" name="value" autocomplete="off" spellcheck="false" />
        </label>
        <div class="group-picker-actions">
          <button type="submit" value="cancel" class="btn ghost" id="prompt-cancel">取消</button>
          <button type="submit" value="ok" class="btn primary" id="prompt-ok">确定</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
